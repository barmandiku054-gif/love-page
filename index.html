<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diku & Gayatri | Wedding Invitation</title>
    <style>
        :root {
            --deep-maroon: #4a0404;
            --gold: #d4af37;
            --cream: #fffdd0;
            --soft-pink: #ffb6c1;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Dancing Script', cursive, sans-serif;
            background-color: var(--deep-maroon);
            color: var(--cream);
            overflow-x: hidden;
        }

        /* Loading Screen */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--deep-maroon);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        /* Basic Styles for Pages */
        .page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            position: absolute;
            width: 100%;
        }

        .active { opacity: 1; position: relative; }

        button {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 15px 30px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.3s;
        }

        button:hover { background: var(--gold); color: var(--deep-maroon); }

        /* Card Style */
        .invitation-card {
            border: 5px solid var(--gold);
            padding: 40px;
            background: rgba(74, 4, 4, 0.8);
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div id="loader">
        <p>Something Beautiful is on the Way...</p>
        <div id="progress-bar" style="width: 50%; height: 10px; background: white;"><div id="fill" style="width: 0%; height: 100%; background: var(--gold);"></div></div>
    </div>

    <div id="content" style="display:none;">
        <div class="page active" id="page1">
            <h1>Two hearts, two dreams, one beautiful journey.</h1>
            <button onclick="nextPage()">Enter</button>
        </div>
        
        <!-- Additional pages would follow structure of page 1 -->
        
        <div class="page" id="page8">
            <div class="invitation-card">
                <h2>Diku Barman & Gayatri</h2>
                <p>Wedding Date: 03 / 05 / 2028</p>
                <p>Venue: Sarthebari Palla Satra</p>
                <p>Contact: 6001808024</p>
            </div>
            <div id="surprise" style="margin-top: 20px; font-size: 1.5rem;">
                "Thank You for Being a Part of Our Special Day!"
            </div>
        </div>
    </div>

    <script>
        // Simple script to handle flow
        window.onload = () => {
            let width = 0;
            let id = setInterval(() => {
                if (width >= 100) {
                    clearInterval(id);
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                } else {
                    width++;
                    document.getElementById('fill').style.width = width + '%';
                }
            }, 30);
        };

        function nextPage() {
            // Logic to toggle 'active' class between pages
            alert("This is a template structure. The full animation logic for all 8 pages would be initialized here.");
        }
    </script>
</body>
</html>
