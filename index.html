<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just One Question ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
text-align:center;
color:white;
}

h1{
font-size:2.3rem;
}

button{
padding:15px 30px;
font-size:20px;
margin:15px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.3s;
}

#yes{
background:#ff4081;
color:white;
}

#no{
background:white;
color:#ff4081;
position:absolute;
}

.heart{
position:absolute;
color:red;
animation:float 6s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:1;
}
100%{
transform:translateY(-100px);
opacity:0;
}
}
</style>

</head>
<body>

<div class="container">
<h1>Will you be my forever? ❤️</h1>

<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>

<h2 id="result"></h2>

</div>

<script>

const no=document.getElementById("no");

no.addEventListener("mouseover",()=>{
no.style.left=Math.random()*80+"vw";
no.style.top=Math.random()*80+"vh";
});

document.getElementById("yes").onclick=()=>{
document.getElementById("result").innerHTML="Yay!! ❤️ I knew you'd say YES! 🥰";
};

function hearts(){
const h=document.createElement("div");
h.classList.add("heart");
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(20+Math.random()*30)+"px";
document.body.appendChild(h);

setTimeout(()=>{
h.remove();
},6000);
}

setInterval(hearts,300);

</script>

</body>
</html>
