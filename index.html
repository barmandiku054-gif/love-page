<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Diku ❤️ Gayatri</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ff9ecf,#ffd6e7);overflow:hidden;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff8fc;border-radius:20px;padding:20px;max-width:420px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2);position:relative;z-index:2}
.photos{display:flex;gap:10px;justify-content:center;margin-bottom:15px}
.photos img{width:140px;height:140px;object-fit:cover;border-radius:50%;border:5px solid #ff5c93}
h1{color:#e91e63}
button{padding:12px 25px;font-size:18px;border:none;border-radius:30px;cursor:pointer;margin:10px}
#yes{background:#ff4081;color:#fff}
#no{background:#eee;position:fixed}
#msg{font-size:22px;color:#d81b60;font-weight:bold;margin-top:15px}
.heart{position:fixed;color:#ff2d75;animation:up 6s linear forwards;font-size:22px;pointer-events:none}
@keyframes up{from{transform:translateY(100vh)}to{transform:translateY(-120px);opacity:0}}
</style>
</head>
<body>
<div class="card">
<div class="photos">
<img src="WhatsApp Image 2026-07-16 at 23.46.08.jpeg" alt="Diku">
<img src="WhatsApp Image 2026-07-16 at 23.46.08 (1).jpeg" alt="Gayatri">
</div>
<h1>Diku ❤️ Gayatri</h1>
<h2>Gayatri, Do You Love Me? ❤️</h2>
<button id="yes">Yes ❤️</button>
<button id="no">No 💔</button>
<div id="msg"></div>
<audio id="music" autoplay loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>
</div>
<script>
const no=document.getElementById("no");
no.addEventListener("mouseover",move);
no.addEventListener("click",move);
function move(){
 no.style.left=Math.random()*(window.innerWidth-120)+"px";
 no.style.top=Math.random()*(window.innerHeight-60)+"px";
}
document.getElementById("yes").onclick=()=>{
 document.getElementById("msg").innerHTML="💖 Yay! Thank you Gayatri! Forever Yours, Diku 💖";
 for(let i=0;i<150;i++)setTimeout(makeHeart,i*30);
}
function makeHeart(){
 const h=document.createElement("div");
 h.className="heart";
 h.textContent="❤️";
 h.style.left=Math.random()*100+"vw";
 h.style.fontSize=(18+Math.random()*25)+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
}
setInterval(makeHeart,350);
</script>
</body>
</html>
