<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a tiny surprise ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink1:#ffe1ec;
    --pink2:#ffc9dd;
    --rose:#ff9fc0;
    --magenta:#e8699a;
    --lav1:#ecdcff;
    --lav2:#d9bdff;
    --deep:#8a4a86;
    --gold:#ffe9ad;
    --glass-bg: rgba(255,255,255,0.38);
    --glass-border: rgba(255,255,255,0.6);
    --shadow-soft: 0 10px 34px rgba(170,90,160,0.18);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%; width:100%;
    overflow-x:hidden;
    font-family:'Quicksand', sans-serif;
    color:#6b3f66;
  }
  body{
    background: linear-gradient(-45deg, #ffe1ec, #ecdcff, #ffd9ec, #e3ccff);
    background-size: 400% 400%;
    animation: gradientShift 16s ease infinite;
    min-height:100vh;
  }
  @keyframes gradientShift{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }
  #app{ position:relative; min-height:100vh; width:100%; }

  /* ---------- Ambient layers ---------- */
  #ambient{ position:fixed; inset:0; pointer-events:none; z-index:2; overflow:hidden; }
  .petal, .heart-float, .sparkle, .butterfly{ position:absolute; will-change:transform; }
  .petal{
    width:16px; height:16px;
    background: radial-gradient(circle at 30% 30%, #ffe3ee, var(--rose));
    border-radius: 0 60% 0 60%;
    opacity:0.85;
    animation: fall linear infinite, sway ease-in-out infinite;
    filter: drop-shadow(0 2px 3px rgba(200,80,150,0.25));
  }
  @keyframes fall{
    0%{ transform: translateY(-10vh) rotate(0deg); }
    100%{ transform: translateY(110vh) rotate(400deg); }
  }
  @keyframes sway{
    0%,100%{ margin-left:0px; }
    50%{ margin-left:40px; }
  }
  .heart-float{
    font-size:18px; color:var(--rose); opacity:0.55;
    animation: floatUp linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,159,192,0.5));
  }
  @keyframes floatUp{
    0%{ transform: translateY(10vh) scale(0.8) rotate(-8deg); opacity:0; }
    10%{ opacity:0.6; }
    90%{ opacity:0.6; }
    100%{ transform: translateY(-110vh) scale(1.2) rotate(8deg); opacity:0; }
  }
  .sparkle{
    width:6px; height:6px; background:var(--gold); border-radius:50%;
    box-shadow:0 0 8px 2px rgba(255,233,173,0.9);
    animation: twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:1; transform:scale(1.1); }
  }
  .butterfly{ font-size:22px; animation: flutter linear infinite; opacity:0.85; }
  @keyframes flutter{
    0%{ transform: translate(-10vw, 60vh) rotate(0deg); }
    25%{ transform: translate(30vw, 20vh) rotate(15deg); }
    50%{ transform: translate(70vw, 55vh) rotate(-10deg); }
    75%{ transform: translate(40vw, 15vh) rotate(10deg); }
    100%{ transform: translate(-10vw, 60vh) rotate(0deg); }
  }

  /* ---------- Glass card ---------- */
  .glass{
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-radius: 30px;
    box-shadow: var(--shadow-soft), inset 0 1px 0 rgba(255,255,255,0.6);
  }

  /* ---------- Loading screen ---------- */
  #loader{
    position:fixed; inset:0; z-index:50;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(160deg, var(--pink1), var(--lav1));
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }
  #loader.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .loader-heart{
    width:60px; height:60px; position:relative; margin-bottom:22px;
    animation: heartbeat 1.1s ease-in-out infinite;
  }
  .loader-heart::before, .loader-heart::after{
    content:''; position:absolute; top:0; width:32px; height:48px; border-radius:32px 32px 0 0;
    background: linear-gradient(150deg, var(--rose), var(--magenta));
  }
  .loader-heart::before{ left:30px; transform: rotate(-45deg); transform-origin: 0 100%; }
  .loader-heart::after{ left:0; transform: rotate(45deg); transform-origin: 100% 100%; }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    30%{ transform:scale(1.18); }
    45%{ transform:scale(0.95); }
    60%{ transform:scale(1.1); }
  }
  #loader p{ font-family:'Dancing Script', cursive; font-size:1.5rem; color:var(--deep); letter-spacing:0.5px; }
  .loader-bar{ width:180px; height:6px; border-radius:6px; background:rgba(255,255,255,0.6); overflow:hidden; margin-top:14px; }
  .loader-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--rose),var(--lav2)); border-radius:6px; animation: loadfill 1.8s ease forwards; }
  @keyframes loadfill{ to{ width:100%; } }

  /* ---------- Stage / screens ---------- */
  #stage{
    position:relative; z-index:10;
    min-height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    padding: 6vh 5vw;
  }
  .screen{
    display:none;
    width:100%; max-width:560px;
    padding: 48px 38px;
    text-align:center;
  }
  .screen.active{
    display:block;
    animation: cardIn 0.7s cubic-bezier(.2,.9,.3,1.2);
  }
  .screen.leaving{
    animation: cardOut 0.4s ease forwards;
  }
  @keyframes cardIn{
    from{ opacity:0; transform: translateY(24px) scale(0.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes cardOut{
    from{ opacity:1; transform: translateY(0) scale(1); }
    to{ opacity:0; transform: translateY(-16px) scale(0.97); }
  }

  .eyebrow{
    font-size:0.76rem; letter-spacing:3px; text-transform:uppercase;
    color:var(--deep); opacity:0.6; margin-bottom:10px; font-weight:600;
  }
  h1, h2{
    font-family:'Playfair Display', serif; font-style:italic;
    color:var(--deep); margin:0 0 16px;
    font-size: clamp(1.5rem, 4vw, 2.3rem);
    line-height:1.3;
  }
  .script{ font-family:'Dancing Script', cursive; font-weight:700; color:var(--magenta); }
  .typewriter{
    font-size: clamp(1rem, 2.4vw, 1.2rem);
    min-height: 3.2em;
    line-height:1.6;
    color:#6b3f66;
    margin: 0 0 26px;
  }
  .typewriter .cursor{ display:inline-block; width:2px; background:var(--magenta); margin-left:2px; animation: blink 0.8s step-end infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .btn-row{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; margin-top:8px; }
  button{
    font-family:'Quicksand', sans-serif; font-weight:700; font-size:1rem;
    padding:14px 30px; border-radius:999px; border:none; cursor:pointer;
    color:#fff; background: linear-gradient(135deg, var(--rose), var(--lav2));
    box-shadow: 0 6px 20px rgba(200,120,190,0.35);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  button:hover{ transform: translateY(-2px) scale(1.03); box-shadow: 0 10px 26px rgba(200,120,190,0.45); }
  button:active{ transform: translateY(0) scale(0.98); }
  .btn-ghost{
    background: rgba(255,255,255,0.5);
    color:var(--deep);
    border:1px solid rgba(255,255,255,0.8);
    box-shadow:none;
  }

  .progress-dots{ display:flex; gap:8px; justify-content:center; margin-bottom:22px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:rgba(138,74,134,0.22); transition: all 0.3s ease; }
  .dot.on{ background:var(--magenta); width:22px; border-radius:6px; }

  .card-emoji{ font-size:2.6rem; margin-bottom:10px; }

  /* Final screen */
  .heart-burst{
    font-size:3rem; margin-bottom:6px;
    animation: bigPulse 1.4s ease-in-out infinite;
  }
  @keyframes bigPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.15) rotate(-3deg); }
  }

  /* Confetti canvas */
  #confetti-canvas{ position:fixed; inset:0; z-index:60; pointer-events:none; }

  /* Music toggle */
  #musicToggle{
    position:fixed; top:18px; right:18px; z-index:70;
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:1.3rem; padding:0;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-soft);
    color: var(--deep);
  }
  #musicToggle:hover{ transform: translateY(-2px) scale(1.05); }
  #musicToggle .bars{ display:flex; gap:2px; align-items:flex-end; height:16px; }
  #musicToggle .bars span{
    width:3px; background:var(--magenta); border-radius:2px; height:6px;
  }
  #musicToggle.playing .bars span{ animation: eq 0.9s ease-in-out infinite; }
  #musicToggle .bars span:nth-child(1){ animation-delay:0s; }
  #musicToggle .bars span:nth-child(2){ animation-delay:0.2s; }
  #musicToggle .bars span:nth-child(3){ animation-delay:0.4s; }
  @keyframes eq{
    0%,100%{ height:6px; }
    50%{ height:16px; }
  }

  @media (max-width:480px){
    .screen{ padding:34px 22px; }
    button{ padding:12px 22px; font-size:0.92rem; }
    #musicToggle{ width:46px; height:46px; top:14px; right:14px; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-heart"></div>
  <p>A tiny surprise is loading...</p>
  <div class="loader-bar"><div class="loader-bar-fill"></div></div>
</div>

<button id="musicToggle" aria-label="Play soft background music" title="Play soft background music">
  <div class="bars"><span></span><span></span><span></span></div>
</button>

<div id="app">
  <div id="ambient"></div>

  <div id="stage">

    <!-- Screen 0: greeting -->
    <div class="screen glass active" data-screen="0">
      <div class="card-emoji">👋</div>
      <h1>Hey <span class="script">there.</span></h1>
      <p class="typewriter" id="tw0"></p>
      <div class="btn-row">
        <button onclick="goTo(1)">Open Surprise ✨</button>
      </div>
    </div>

    <!-- Screen 1: card 1 -->
    <div class="screen glass" data-screen="1">
      <div class="progress-dots">
        <span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="card-emoji">😊</div>
      <p class="typewriter" id="tw1" style="font-size:clamp(1.1rem,2.8vw,1.35rem);"></p>
      <div class="btn-row">
        <button onclick="goTo(2)">next</button>
      </div>
    </div>

    <!-- Screen 2: card 2 -->
    <div class="screen glass" data-screen="2">
      <div class="progress-dots">
        <span class="dot"></span><span class="dot on"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <div class="card-emoji">💬</div>
      <p class="typewriter" id="tw2" style="font-size:clamp(1.1rem,2.8vw,1.35rem);"></p>
      <div class="btn-row">
        <button class="btn-ghost" onclick="goTo(1)">back</button>
        <button onclick="goTo(3)">next</button>
      </div>
    </div>

    <!-- Screen 3: card 3 -->
    <div class="screen glass" data-screen="3">
      <div class="progress-dots">
        <span class="dot"></span><span class="dot"></span><span class="dot on"></span><span class="dot"></span>
      </div>
      <div class="card-emoji">😉</div>
      <p class="typewriter" id="tw3" style="font-size:clamp(1.1rem,2.8vw,1.35rem);"></p>
      <div class="btn-row">
        <button class="btn-ghost" onclick="goTo(2)">back</button>
        <button onclick="goTo(4)">next</button>
      </div>
    </div>

    <!-- Screen 4: card 4 -->
    <div class="screen glass" data-screen="4">
      <div class="progress-dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot on"></span>
      </div>
      <div class="card-emoji">🌸</div>
      <p class="typewriter" id="tw4" style="font-size:clamp(1.1rem,2.8vw,1.35rem);"></p>
      <div class="btn-row">
        <button class="btn-ghost" onclick="goTo(3)">back</button>
        <button onclick="goTo(5)">next</button>
      </div>
    </div>

    <!-- Screen 5: reveal + reactions -->
    <div class="screen glass" data-screen="5">
      <div class="eyebrow">the reason for all this</div>
      <h1>I thought I'd make this little page <span class="script">just to brighten your day.</span></h1>
      <p class="typewriter" id="tw5" style="min-height:2.4em;"></p>
      <div class="btn-row">
        <button onclick="react('smile')">😊 That made me smile</button>
        <button onclick="react('sweet')">🌸 You're sweet</button>
      </div>
    </div>

    <!-- Final -->
    <div class="screen glass" id="finalMsg">
      <div class="heart-burst">💖</div>
      <h1>Mission accomplished! <span class="script">😊</span></h1>
      <p class="typewriter" id="twFinal" style="min-height:auto;"></p>
    </div>

  </div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
/* ---------------- Ambient background generation ---------------- */
const ambient = document.getElementById('ambient');
function rand(min,max){ return Math.random()*(max-min)+min; }

function spawnPetals(n){
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='petal';
    p.style.left = rand(0,100)+'vw';
    p.style.top = rand(-20,-2)+'vh';
    const dur = rand(9,18);
    p.style.animationDuration = dur+'s, '+rand(2,4)+'s';
    p.style.animationDelay = rand(0,14)+'s, 0s';
    p.style.width = p.style.height = rand(10,20)+'px';
    ambient.appendChild(p);
  }
}
function spawnHearts(n){
  const glyphs=['💗','💕','🩷','❤️','💞'];
  for(let i=0;i<n;i++){
    const h = document.createElement('div');
    h.className='heart-float';
    h.textContent = glyphs[Math.floor(rand(0,glyphs.length))];
    h.style.left = rand(0,100)+'vw';
    h.style.fontSize = rand(14,28)+'px';
    const dur = rand(10,20);
    h.style.animationDuration = dur+'s';
    h.style.animationDelay = rand(0,16)+'s';
    ambient.appendChild(h);
  }
}
function spawnSparkles(n){
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    s.style.left = rand(0,100)+'vw';
    s.style.top = rand(0,100)+'vh';
    s.style.animationDuration = rand(1.6,3.2)+'s';
    s.style.animationDelay = rand(0,4)+'s';
    ambient.appendChild(s);
  }
}
function spawnButterflies(n){
  for(let i=0;i<n;i++){
    const b = document.createElement('div');
    b.className='butterfly';
    b.textContent='🦋';
    b.style.animationDuration = rand(16,26)+'s';
    b.style.animationDelay = rand(0,10)+'s';
    b.style.top = rand(0,10)+'vh';
    ambient.appendChild(b);
  }
}
spawnPetals(18);
spawnHearts(12);
spawnSparkles(24);
spawnButterflies(3);

/* ---------------- Loader ---------------- */
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('loader').classList.add('hidden');
    typeLine(0);
  }, 1900);
});

/* ---------------- Typewriter ---------------- */
const lines = {
  0: "I made something fun... just for you 😊",
  1: "Someone has a really beautiful smile 😊",
  2: "She somehow makes ordinary conversations feel more interesting.",
  3: "She's reading this page right now... 😉",
  4: "I don't know if you noticed... but you make me smile too.",
  5: ""
};
const typedFlags = {};

function typeLine(step){
  if(typedFlags[step]) return;
  typedFlags[step] = true;
  const el = document.getElementById('tw'+step);
  const text = lines[step];
  el.innerHTML = '';
  let i = 0;
  const cursor = document.createElement('span');
  cursor.className='cursor';
  cursor.innerHTML='&nbsp;';
  function tick(){
    if(i <= text.length){
      el.textContent = text.slice(0,i);
      el.appendChild(cursor);
      i++;
      setTimeout(tick, 24);
    }
  }
  tick();
}

/* ---------------- Navigation ---------------- */
function goTo(step){
  const current = document.querySelector('.screen.active');
  const next = document.querySelector(`.screen[data-screen="${step}"]`);
  if(current){
    current.classList.remove('active');
  }
  next.classList.add('active');
  typeLine(step);
}

/* ---------------- Reactions ---------------- */
let reacted = false;
function react(kind){
  if(reacted) return;
  reacted = true;
  document.querySelector('.screen.active').classList.remove('active');
  const finalEl = document.getElementById('finalMsg');
  finalEl.classList.add('active');
  burstConfetti();
  setTimeout(burstConfetti, 550);
  spawnHearts(10);
  spawnSparkles(14);
  spawnButterflies(2);

  const el = document.getElementById('twFinal');
  const text = "If this made you smile, then it was worth every second.\nHope your day is as lovely as your smile. 🌸✨";
  el.innerHTML = '';
  let i = 0;
  function tick(){
    if(i <= text.length){
      el.innerHTML = text.slice(0,i).replace('\n','<br>');
      i++;
      setTimeout(tick, 20);
    }
  }
  tick();
}

/* ---------------- Confetti ---------------- */
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let confettiPieces = [];
const confettiColors = ['#ff9fc0','#e8699a','#ffe9ad','#d9bdff','#ffffff','#ffc9dd'];

function burstConfetti(){
  confettiPieces = [];
  for(let i=0;i<160;i++){
    confettiPieces.push({
      x: canvas.width/2 + rand(-40,40),
      y: canvas.height/2,
      vx: rand(-6,6),
      vy: rand(-9,-2),
      size: rand(4,9),
      color: confettiColors[Math.floor(rand(0,confettiColors.length))],
      rot: rand(0,360),
      vr: rand(-8,8),
      shape: Math.random() > 0.5 ? 'rect' : 'heart',
      gravity: rand(0.15,0.28)
    });
  }
  animateConfetti();
}
function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let alive = false;
  confettiPieces.forEach(p=>{
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    if(p.y < canvas.height + 20) alive = true;
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot * Math.PI/180);
    ctx.fillStyle = p.color;
    if(p.shape==='rect'){
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
    } else {
      ctx.font = p.size*2+'px serif';
      ctx.fillText('❤', -p.size, p.size/2);
    }
    ctx.restore();
  });
  if(alive){
    requestAnimationFrame(animateConfetti);
  } else {
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
}

/* ---------------- Soft synthesized background music ---------------- */
/* No external audio file is loaded — a gentle ambient pad is generated
   in the browser with the Web Audio API so the page stays self-contained.
   It never autoplays; it only starts after the listener taps the button. */
let audioCtx = null;
let musicNodes = null;
let isPlaying = false;

function buildPad(){
  const ctx = audioCtx;
  const master = ctx.createGain();
  master.gain.value = 0;
  master.connect(ctx.destination);
  master.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 1.2);

  const notes = [261.63, 329.63, 392.00, 523.25]; // soft C major pad
  const oscs = [];
  notes.forEach((freq, idx)=>{
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.value = freq;
    const gain = ctx.createGain();
    gain.gain.value = 0.5 / notes.length;

    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.12 + idx * 0.03;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = freq * 0.004;
    lfo.connect(lfoGain);
    lfoGain.connect(osc.frequency);

    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 1200;

    osc.connect(gain);
    gain.connect(filter);
    filter.connect(master);

    osc.start();
    lfo.start();
    oscs.push(osc, lfo);
  });

  return { master, oscs };
}

function toggleMusic(){
  const btn = document.getElementById('musicToggle');
  if(!isPlaying){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    if(!musicNodes){
      musicNodes = buildPad();
    } else {
      musicNodes.master.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 0.8);
    }
    isPlaying = true;
    btn.classList.add('playing');
    btn.title = 'Pause music';
  } else {
    if(musicNodes){
      musicNodes.master.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);
    }
    isPlaying = false;
    btn.classList.remove('playing');
    btn.title = 'Play soft background music';
  }
}
document.getElementById('musicToggle').addEventListener('click', toggleMusic);
</script>
</body>
</html>
